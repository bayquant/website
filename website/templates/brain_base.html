{% extends "base.html" %}
{% set section = "notes" %}
{% block title %}Notes · BayQuant{% endblock %}

{% block styles %}
<style>
  /* Center the 46rem reading column; the gutter still applies on narrow screens. */
  main {
    width: 100%;
    max-width: calc(46rem + 2 * var(--gutter));
    margin: 0 auto;
    padding: clamp(40px, 10vh, 96px) var(--gutter) 96px;
  }

  .intro h1 {
    font-family: var(--sans);
    font-size: 0.9375rem;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--pacific);
    margin-bottom: 12px;
  }

  .eyebrow {
    font-family: var(--sans);
    font-size: 0.9375rem;
    color: var(--pacific);
  }
  .eyebrow a { text-decoration: none; }
  .eyebrow a:hover { color: var(--slate); }

  /* ---------- Note list ---------- */
  .index {
    margin-top: clamp(48px, 8vh, 80px);
    max-width: 46rem;
    list-style: none;
  }
  .index li {
    border-top: 1px solid var(--rule);
  }
  .index li:last-child { border-bottom: 1px solid var(--rule); }
  .index a {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 24px;
    padding: 16px 0;
    text-decoration: none;
  }
  .index a:hover .n-title { color: var(--orange); }
  .n-title { transition: color 0.2s ease; }
  .n-tags {
    font-family: var(--sans);
    font-size: 0.8125rem;
    color: var(--pacific);
    text-align: right;
  }

  /* Folders: sans face, a chevron and a note count, so they never read as notes. */
  .folder summary {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 24px;
    padding: 16px 0;
    cursor: pointer;
    list-style: none;
  }
  .folder summary::-webkit-details-marker { display: none; }
  .folder summary:focus-visible {
    outline: 2px solid var(--orange);
    outline-offset: 3px;
    border-radius: 2px;
  }
  .f-name {
    font-family: var(--sans);
    font-size: 0.9375rem;
    font-weight: 500;
    transition: color 0.2s ease;
  }
  .f-name::before {
    content: "›";
    display: inline-block;
    width: 1em;
    color: var(--pacific);
    transition: transform 0.2s ease;
  }
  .folder details[open] > summary .f-name::before { transform: rotate(90deg); }
  .folder summary:hover .f-name { color: var(--orange); }

  .index .index {
    margin-top: 0;
    padding-left: 1em;
  }
  .index .index li:last-child { border-bottom: none; }

  .count,
  .empty {
    margin-top: 16px;
    font-family: var(--sans);
    font-size: 0.8125rem;
    color: var(--pacific);
    font-variant-numeric: tabular-nums;
  }
  .empty { font-size: 0.9375rem; }

  /* ---------- Note ---------- */
  .note { max-width: 46rem; }
  .note .eyebrow { margin-bottom: 20px; }

  .note-content > h1 {
    font-size: clamp(1.75rem, 3.4vw, 2.25rem);
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 32px;
  }
  .note-content h2,
  .note-content h3,
  .note-content h4 {
    font-family: var(--sans);
    font-weight: 500;
    line-height: 1.4;
  }
  .note-content h2 {
    font-size: 1rem;
    margin: 48px 0 12px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
  }
  .note-content h3 {
    font-size: 0.9375rem;
    color: var(--pacific);
    margin: 32px 0 8px;
  }
  .note-content h4 {
    font-size: 0.875rem;
    color: var(--pacific);
    margin: 24px 0 8px;
  }

  .note-content p,
  .note-content ul,
  .note-content ol,
  .note-content pre,
  .note-content table,
  .note-content blockquote { margin-bottom: 1em; }
  .note-content ul,
  .note-content ol { padding-left: 1.4em; }
  .note-content li + li { margin-top: 0.25em; }
  .note-content li > ul,
  .note-content li > ol { margin: 0.25em 0 0; }

  .note-content blockquote {
    padding-left: 18px;
    border-left: 2px solid var(--rule);
    color: var(--pacific);
    font-style: italic;
  }

  .note-content hr {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 40px 0;
  }

  .note-content code {
    font-family: var(--mono);
    font-size: 0.82em;
  }
  .note-content :not(pre) > code {
    padding: 1px 5px;
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  .note-content pre {
    overflow-x: auto;
    padding: 16px 18px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    line-height: 1.55;
  }

  .note-content table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--sans);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
    display: block;
    overflow-x: auto;
  }
  .note-content th,
  .note-content td {
    padding: 8px 16px 8px 0;
    text-align: left;
    vertical-align: top;
    border-bottom: 1px solid var(--rule);
  }
  .note-content th {
    font-weight: 500;
    color: var(--pacific);
  }

  .note-content img { max-width: 100%; height: auto; }

  .note-content .katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 0;
  }

  @media (max-width: 640px) {
    .index a { grid-template-columns: 1fr; gap: 2px; }
    .n-tags { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .n-title,
    .f-name,
    .f-name::before { transition: none; }
  }
</style>
{% endblock %}

{% block footer %}Notes from <a href="https://github.com/bayquant/brain" target="_blank" rel="noopener">bayquant/brain</a> · © 2026 BayQuant{% endblock %}
