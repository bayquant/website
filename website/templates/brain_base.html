<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Brain — BayQuant{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --abyss: #060f18;
      --bay: #1c6e82;
      --bridge: #c43010;
      --ember: #e06030;
      --fog: #e8efeb;
      --ink: #07141c;
      --muted: #4f6877;

      --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
      --font-body: "Source Serif 4", Georgia, serif;
      --font-mono: "IBM Plex Mono", "SF Mono", "Courier New", monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: #f4f8fa;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a:focus-visible {
      outline: 2px solid var(--ember);
      outline-offset: 3px;
    }

    /* ---------- Header ---------- */
    .brain-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px clamp(20px, 4vw, 40px);
      background: rgba(244, 248, 250, 0.85);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(28, 110, 130, 0.16);
    }

    .bh-brand {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }
    .bh-crumb {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--bay);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .bh-crumb:hover { color: var(--bridge); }
    .q { color: var(--bridge); }

    /* ---------- Layout ---------- */
    .brain-main {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 44px clamp(20px, 5vw, 32px) 72px;
      flex: 1 0 auto;
    }

    /* ---------- Index ---------- */
    .brain-intro { margin-bottom: 32px; }
    .bi-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bridge);
      margin-bottom: 12px;
    }
    .brain-intro h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4.5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 12px;
    }
    .brain-intro p {
      font-size: 1.05rem;
      color: #33505f;
      max-width: 62ch;
    }

    .note-count {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .note-list { display: flex; flex-direction: column; gap: 10px; }

    .note-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid rgba(28, 110, 130, 0.18);
      border-radius: 6px;
      text-decoration: none;
      background: #ffffff;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }
    .note-row:hover {
      border-color: rgba(196, 48, 16, 0.45);
      background: rgba(196, 48, 16, 0.03);
    }

    .n-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--ink);
    }
    .note-row:hover .n-title { color: var(--bridge); }

    .n-tags {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }
    .n-tags span {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--bay);
      border: 1px solid rgba(28, 110, 130, 0.28);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .n-arrow {
      margin-left: auto;
      font-family: var(--font-mono);
      color: var(--bridge);
      opacity: 0.55;
      flex-shrink: 0;
    }
    .note-row:hover .n-arrow { opacity: 1; }

    .brain-empty {
      padding: 28px;
      border: 1px dashed rgba(28, 110, 130, 0.3);
      border-radius: 6px;
      color: var(--muted);
      font-size: 1rem;
    }

    /* ---------- Note ---------- */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--bay);
      text-decoration: none;
      margin-bottom: 22px;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: var(--bridge); }

    .note-card {
      background: #ffffff;
      border: 1px solid rgba(28, 110, 130, 0.14);
      border-radius: 10px;
      padding: 40px clamp(22px, 4vw, 48px);
      box-shadow: 0 1px 2px rgba(6, 15, 24, 0.04), 0 14px 34px rgba(6, 15, 24, 0.05);
    }

    /* Note body: keep the vault's brain.css colors, lend it the BayQuant faces */
    .note-content { font-family: var(--font-body); font-size: 1.02rem; }
    .note-content h1,
    .note-content h2,
    .note-content h3 { font-family: var(--font-display); }

    /* ---------- Footer ---------- */
    .brain-footer {
      flex-shrink: 0;
      border-top: 1px solid rgba(28, 110, 130, 0.12);
      padding: 26px 24px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .brain-footer a { color: var(--bay); text-decoration: none; }
    .brain-footer a:hover { color: var(--bridge); }
    .fb-mark {
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink);
    }
  </style>
  <style>{{ css | safe }}</style>
</head>
<body>
  <header class="brain-header">
    <a class="bh-brand" href="/">Bay<span class="q">Quant</span></a>
    <a class="bh-crumb" href="/brain">Brain</a>
  </header>

  <main class="brain-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="brain-footer">
    <span class="fb-mark">Bay<span class="q">Quant</span></span> · The Brain — notes from
    <a href="https://github.com/bayquant/brain" target="_blank" rel="noopener">bayquant/brain</a>
  </footer>
</body>
</html>
