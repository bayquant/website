<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BayQuant{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;1,400&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --fog: #e9ecec;
      --rule: #cdd4d6;
      --slate: #1e2b31;
      --pacific: #566971;
      --orange: #c0362c;

      --serif: "Libertinus Serif", Georgia, serif;
      --sans: "Public Sans", "Helvetica Neue", Arial, sans-serif;
      --mono: "SF Mono", Menlo, Consolas, monospace;
      --gutter: clamp(20px, 6vw, 96px);
    }

    /* The background follows the light in San Francisco, set by the script below. */
    :root[data-daypart="morning"] { --fog: #e6eaeb; }
    :root[data-daypart="midday"] { --fog: #eef0f0; }
    :root[data-daypart="golden"] { --fog: #eeebe8; }
    :root[data-daypart="night"] { --fog: #e5e7eb; }

    @media (prefers-color-scheme: dark) {
      :root,
      :root[data-daypart] {
        --fog: #161b1e;
        --rule: #2c373c;
        --slate: #d9e0e2;
        --pacific: #8fa0a7;
        --orange: #e0553f;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background: var(--fog); }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--slate);
      font-family: var(--serif);
      font-size: 1.125rem;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration-line: underline;
      text-decoration-color: var(--rule);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.22em;
      transition: text-decoration-color 0.2s ease;
    }
    a:hover { text-decoration-color: var(--orange); }
    a:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
      border-radius: 2px;
    }

    /* ---------- Header ---------- */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 32px var(--gutter);
      font-family: var(--sans);
      font-size: 0.9375rem;
    }
    .brand {
      font-weight: 500;
      text-decoration: none;
    }
    .site-nav { display: flex; gap: 28px; }
    .site-nav a {
      color: var(--pacific);
      text-decoration: none;
    }
    .site-nav a:hover,
    .site-nav a[aria-current] { color: var(--slate); }

    /* ---------- Content ---------- */
    main { flex: 1; }

    .intro {
      max-width: 46rem;
      font-size: clamp(1.375rem, 2.4vw, 1.75rem);
      line-height: 1.45;
      letter-spacing: -0.005em;
    }

    /* ---------- Footer ---------- */
    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 32px var(--gutter) 40px;
      font-family: var(--sans);
      font-size: 0.8125rem;
      color: var(--pacific);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 640px) {
      .site-footer { flex-direction: column; gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">BayQuant</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/brain"{% if section == "notes" %} aria-current="page"{% endif %}>Notes</a>
      <a href="https://bayquant.github.io/xpectral/">xpectral</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span id="sf-time" hidden></span>
    <span>{% block footer %}© 2026 BayQuant{% endblock %}</span>
  </footer>

  <script>
    (function () {
      var clock = document.getElementById("sf-time");
      var format = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        hour: "numeric",
        minute: "2-digit",
      });
      var hourOf = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        hour: "numeric",
        hourCycle: "h23",
      });

      function update() {
        var now = new Date();
        var hour = Number(hourOf.format(now));
        var daypart = hour >= 6 && hour < 11 ? "morning"
          : hour >= 11 && hour < 17 ? "midday"
          : hour >= 17 && hour < 20 ? "golden"
          : "night";
        document.documentElement.dataset.daypart = daypart;
        clock.textContent = format.format(now).toLowerCase() + " in San Francisco";
        clock.hidden = false;
      }

      update();
      setInterval(update, 30000);
    })();
  </script>
</body>
</html>
