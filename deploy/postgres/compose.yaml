# Shared Postgres for every app on the droplet. One role and database per app,
# created on first boot by init/. No port is published: other containers reach
# it as postgres:5432 over the external "backend" network.
name: postgres

services:
  postgres:
    container_name: postgres
    # Pin the major version so a redeploy never upgrades the data directory.
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/secrets/postgres.env}
      # One per app, read by init/01-roles.sh
      PREFECT_DB_PASSWORD: ${PREFECT_DB_PASSWORD:?set in /opt/secrets/postgres.env}
    volumes:
      - data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  data:

networks:
  backend:
    external: true
